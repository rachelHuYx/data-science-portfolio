<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#f4f1e9">
    <title>{{ page.title | default: site.title | escape }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header page-width">
      <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="HU JIAYI portfolio home">
        <span class="identity-mark" aria-hidden="true">HJ</span>
        <span>HU JIAYI<span class="wordmark-label">Data Science Portfolio</span></span>
      </a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="#about">About</a>
        <a href="#project">Project</a>
        <a href="#next">What's next</a>
        <a class="nav-github" href="https://github.com/rachelHuYx">GitHub <span aria-hidden="true">↗</span></a>
      </nav>
    </header>
    <main id="main-content" class="page-width" tabindex="-1">
      {{ content }}
    </main>
    <footer class="site-footer page-width">
      <p>HU JIAYI <span aria-hidden="true">/</span> CISC7204</p>
      <a href="https://github.com/rachelHuYx/data-science-portfolio">Portfolio source <span aria-hidden="true">↗</span></a>
      <p class="footer-note">Questions first. Evidence before conclusions.</p>
    </footer>
  </body>
</html>
